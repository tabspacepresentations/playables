<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>Checkers - Tabspace Playables</title>
    <meta name="description" content="Play classic Checkers online for free on Tabspace Playables. Jump and capture your opponent's pieces to claim victory on desktop and mobile.">
    <meta name="keywords" content="Checkers online, draughts game, play checkers free, board games online, Tabspace Playables, strategy board game">
    <link rel="canonical" href="https://tabspacepresentations.com/playables/play/checkers">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Checkers - Tabspace Playables">
    <meta property="og:description" content="Challenge yourself with the classic Checkers board game. Jump opposing pieces, crown your kings, and win the match!">
    <meta property="og:url" content="https://tabspacepresentations.com/playables/play/checkers">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6D00',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
            touch-action: manipulation;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }

        .checkers-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .checkers-cell.light {
            background-color: #d4d4d8;
        }
        .checkers-cell.dark {
            background-color: #27272a;
        }
        .checkers-cell.selected {
            background-color: #15803d !important;
        }
        .checkers-cell.valid-move {
            background-color: rgba(34, 197, 94, 0.5) !important;
        }

        .checker-piece {
            width: 75%;
            height: 75%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            font-size: 0.75rem;
        }
        .checker-piece.red {
            background: radial-gradient(circle at 30% 30%, #ef4444 0%, #991b1b 100%);
            color: #ffffff;
            border: 1px solid #7f1d1d;
        }
        .checker-piece.black {
            background: radial-gradient(circle at 30% 30%, #52525b 0%, #09090b 100%);
            color: #ffffff;
            border: 1px solid #27272a;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">
                    <img src="../../../images/logo.png" alt="Tabspace Presentations Logo" class="h-16 md:h-20 w-auto object-contain block opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ Checkers</span>
            </div>
            <nav class="hidden md:flex items-center gap-3 text-base">
                <a href="../../" class="btn-card playables-hover text-white px-5 py-2.5 text-sm">Back to Playables</a>
            </nav>
        </div>
    </header>

    <!-- HEADER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">Checkers</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Your turn (Orange Pieces)</p>
        </div>

        <!-- Difficulty Controls -->
        <div class="flex items-center gap-2 bg-zinc-900/60 p-1.5 rounded-xl border border-zinc-800">
            <button type="button" onpointerdown="setDifficulty('easy')" id="btn-easy" class="px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold">Easy</button>
            <button type="button" onpointerdown="setDifficulty('medium')" id="btn-medium" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Medium</button>
            <button type="button" onpointerdown="setDifficulty('hard')" id="btn-hard" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Hard</button>
        </div>

        <!-- Checkers Board Grid (8x8 matched to Chess size: max-[540px]) -->
        <div id="checkers-board" class="grid grid-cols-8 w-full max-w-[540px] aspect-square card-section p-2 bg-zinc-900/90 gap-[1px] bg-zinc-700">
            <!-- Dynamically generated via JS -->
        </div>

        <!-- Action Controls -->
        <div class="flex gap-2 justify-center pt-2">
            <button type="button" onpointerdown="resetGame()" class="cta-btn-green px-6 py-2 text-sm">New Game</button>
            <button type="button" onpointerdown="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">
                <span>Fullscreen</span> ⛶
            </button>
        </div>

        <!-- RESULT POPUP MODAL -->
        <div id="result-modal" class="absolute inset-0 z-50 flex items-center justify-center modal-backdrop hidden rounded-xl">
            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Game Over</h2>
                <p id="modal-message" class="text-zinc-300 text-base">Game concluded.</p>
                <div>
                    <button type="button" onpointerdown="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // Fullscreen Toggle Logic
        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        // Board representation: 
        // 'r' = orange piece (#ff6D00), 'R' = orange king
        // 'b' = black piece, 'B' = black king
        // '' = empty
        let board = [];
        let turn = 'r'; // 'r' for orange (player), 'b' for black (AI)
        let selectedSquare = null;
        let validMoves = [];
        let isGameActive = true;
        let difficulty = 'easy';
        let isAiTurn = false;

        const boardElement = document.getElementById('checkers-board');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const statusDisplay = document.getElementById('game-status');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });
            resetGame();
        }

        function resetGame() {
            playSound('click');
            board = Array(8).fill(null).map(() => Array(8).fill(''));
            // Setup Black pieces on rows 0, 1, 2
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) board[r][c] = 'b';
                }
            }
            // Setup Orange pieces on rows 5, 6, 7
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) board[r][c] = 'r';
                }
            }
            turn = 'r';
            selectedSquare = null;
            validMoves = [];
            isGameActive = true;
            isAiTurn = false;
            statusDisplay.textContent = "Your turn (Orange Pieces)";
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('button');
                    const isDark = (r + c) % 2 === 1;
                    let classes = `w-full aspect-square flex items-center justify-center transition-all focus:outline-none ${isDark ? 'bg-zinc-800' : 'bg-zinc-700'}`;
                    
                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        classes += " ring-2 ring-brand-green bg-zinc-600";
                    }

                    if (validMoves.some(m => m.r === r && m.c === c)) {
                        classes += " relative after:content-[''] after:absolute after:w-4 after:h-4 after:bg-brand-green after:rounded-full";
                    }

                    cell.className = classes;
                    cell.onpointerdown = (e) => {
                        e.preventDefault();
                        handleSquareClick(r, c);
                    };

                    const p = board[r][c];
                    if (p !== '') {
                        const pieceDiv = document.createElement('div');
                        let pieceClasses = "w-4/5 h-4/5 rounded-full shadow-md flex items-center justify-center text-xs font-bold ";
                        if (p === 'r') {
                            pieceClasses += "border-2 border-orange-400 text-black";
                            pieceDiv.style.backgroundColor = "#ff6D00";
                        } else if (p === 'R') {
                            pieceClasses += "border-2 border-white text-black";
                            pieceDiv.style.backgroundColor = "#ff6D00";
                            pieceDiv.textContent = "★";
                        } else if (p === 'b') {
                            pieceClasses += "bg-zinc-950 border-2 border-zinc-700 text-white";
                        } else if (p === 'B') {
                            pieceClasses += "bg-zinc-950 border-2 border-orange-400 text-orange-400";
                            pieceDiv.textContent = "★";
                        }
                        pieceDiv.className = pieceClasses;
                        cell.appendChild(pieceDiv);
                    }

                    boardElement.appendChild(cell);
                }
            }
        }

        function handleSquareClick(r, c) {
            if (!isGameActive || isAiTurn || turn !== 'r') return;

            const p = board[r][c];
            if (selectedSquare === null) {
                if (p === 'r' || p === 'R') {
                    selectedSquare = {r, c};
                    validMoves = getValidMoves(r, c, board);
                    playSound('click');
                    renderBoard();
                }
            } else {
                if (p === 'r' || p === 'R') {
                    selectedSquare = {r, c};
                    validMoves = getValidMoves(r, c, board);
                    playSound('click');
                    renderBoard();
                    return;
                }

                const move = validMoves.find(m => m.r === r && m.c === c);
                if (move) {
                    executeMove(selectedSquare.r, selectedSquare.c, move);
                    selectedSquare = null;
                    validMoves = [];
                    renderBoard();

                    if (checkGameOver()) return;

                    turn = 'b';
                    isAiTurn = true;
                    statusDisplay.textContent = "Computer is thinking...";
                    setTimeout(aiMove, 600);
                } else {
                    selectedSquare = null;
                    validMoves = [];
                    renderBoard();
                }
            }
        }

        function getValidMoves(r, c, currentBoard) {
            const piece = currentBoard[r][c];
            if (piece === '') return [];
            const moves = [];
            const isKing = piece === piece.toUpperCase();
            const isOrange = piece.toLowerCase() === 'r';
            
            let rowDirs = [];
            if (isOrange) {
                rowDirs.push(-1);
                if (isKing) rowDirs.push(1);
            } else {
                rowDirs.push(1);
                if (isKing) rowDirs.push(-1);
            }

            for (let dr of rowDirs) {
                for (let dc of [-1, 1]) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        const target = currentBoard[nr][nc];
                        if (target === '') {
                            moves.push({r: nr, c: nc, jump: null});
                        } else if (target.toLowerCase() !== piece.toLowerCase()) {
                            const nnr = nr + dr, nnc = nc + dc;
                            if (nnr >= 0 && nnr < 8 && nnc >= 0 && nnc < 8 && currentBoard[nnr][nnc] === '') {
                                moves.push({r: nnr, c: nnc, jump: {r: nr, c: nc}});
                            }
                        }
                    }
                }
            }
            return moves;
        }

        function executeMove(fromR, fromC, move) {
            playSound('click');
            let piece = board[fromR][fromC];
            board[fromR][fromC] = '';

            if (move.jump) {
                board[move.jump.r][move.jump.c] = '';
            }

            if (piece === 'r' && move.r === 0) piece = 'R';
            if (piece === 'b' && move.r === 7) piece = 'B';

            board[move.r][move.c] = piece;
        }

        function aiMove() {
            if (!isGameActive) return;

            let allMoves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c].toLowerCase() === 'b') {
                        let mvs = getValidMoves(r, c, board);
                        mvs.forEach(m => allMoves.push({fromR: r, fromC: c, move: m}));
                    }
                }
            }

            if (allMoves.length === 0) {
                endGame('r');
                return;
            }

            let chosen;
            const jumpMoves = allMoves.filter(m => m.move.jump !== null);
            if (jumpMoves.length > 0 && difficulty !== 'easy') {
                chosen = jumpMoves[Math.floor(Math.random() * jumpMoves.length)];
            } else {
                chosen = allMoves[Math.floor(Math.random() * allMoves.length)];
            }

            executeMove(chosen.fromR, chosen.fromC, chosen.move);
            renderBoard();

            if (checkGameOver()) return;

            turn = 'r';
            isAiTurn = false;
            statusDisplay.textContent = "Your turn (Orange Pieces)";
        }

        function checkGameOver() {
            let orangeCount = 0, blackCount = 0;
            let orangeMovesExist = false, blackMovesExist = false;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p.toLowerCase() === 'r') {
                        orangeCount++;
                        if (getValidMoves(r, c, board).length > 0) orangeMovesExist = true;
                    } else if (p.toLowerCase() === 'b') {
                        blackCount++;
                        if (getValidMoves(r, c, board).length > 0) blackMovesExist = true;
                    }
                }
            }

            if (orangeCount === 0 || (turn === 'r' && !orangeMovesExist)) {
                endGame('b');
                return true;
            }
            if (blackCount === 0 || (turn === 'b' && !blackMovesExist)) {
                endGame('r');
                return true;
            }
            return false;
        }

        function endGame(winner) {
            isGameActive = false;
            if (winner === 'r') {
                modalTitle.textContent = "You Win!";
                modalMessage.textContent = "Great job outmaneuvering the computer!";
                playSound('win');
            } else {
                modalTitle.textContent = "Computer Wins!";
                modalMessage.textContent = "Better luck next time! Try an easier difficulty.";
                playSound('lose');
            }
            resultModal.classList.remove('hidden');
            statusDisplay.textContent = "Game Over";
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
</body>
</html>
