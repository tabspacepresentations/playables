        .font-calisto {

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;

<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">

            <button type="button" onclick="setDifficulty('medium')" id="btn-medium" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Medium</button>
            <button type="button" onclick="setDifficulty('hard')" id="btn-hard" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Hard</button>

        <!-- Gomoku Board Container -->

        </div>

        <!-- Action Controls -->
        <div class="flex gap-2 justify-center pt-2">

            <button type="button" onclick="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">

        <!-- RESULT POPUP MODAL -->

            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Game Over</h2>
                <p id="modal-message" class="text-zinc-300 text-base">Game concluded.</p>
                <div>
                    <button type="button" onclick="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        const BOARD_SIZE = 15;
        let board = [];
        let turn = 'black'; // 'black' (player) or 'white' (AI)
        let isGameActive = true;
        let difficulty = 'easy';
        let isAiTurn = false;

        const canvas = document.getElementById('gomoku-canvas');
        const ctx = canvas.getContext('2d');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const statusDisplay = document.getElementById('game-status');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });
            resetGame();
        }

        function resetGame() {
            playSound('click');
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            turn = 'black';
            isGameActive = true;
            isAiTurn = false;
            statusDisplay.textContent = "Your turn (Black Stones)";
            resizeCanvas();
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            renderBoard();
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        function renderBoard() {
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, width, height);

            // Wood-like background for board
            ctx.fillStyle = '#d9b382';
            ctx.fillRect(0, 0, width, height);

            const padding = width / 15;
            const cellSize = (width - padding * 2) / (BOARD_SIZE - 1);

            // Draw grid lines
            ctx.strokeStyle = '#5a3d1e';
            ctx.lineWidth = 1;

            for (let i = 0; i < BOARD_SIZE; i++) {
                let pos = padding + i * cellSize;
                // Vertical
                ctx.beginPath();
                ctx.moveTo(pos, padding);
                ctx.lineTo(pos, height - padding);
                ctx.stroke();

                // Horizontal
                ctx.beginPath();
                ctx.moveTo(padding, pos);
                ctx.lineTo(width - padding, pos);
                ctx.stroke();
            }

            // Draw stones
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let stone = board[r][c];
                    if (stone) {
                        let cx = padding + c * cellSize;
                        let cy = padding + r * cellSize;
                        ctx.beginPath();
                        ctx.arc(cx, cy, cellSize * 0.42, 0, Math.PI * 2);
                        ctx.fillStyle = stone === 'black' ? '#18181b' : '#f4f4f5';
                        ctx.fill();
                        ctx.lineWidth = 1.5;
                        ctx.strokeStyle = stone === 'black' ? '#000000' : '#d4d4d8';
                        ctx.stroke();
                    }
                }
            }
        }

        canvas.addEventListener('click', (e) => {
            if (!isGameActive || isAiTurn || turn !== 'black') return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const width = canvas.width / window.devicePixelRatio;
            const padding = width / 15;
            const cellSize = (width - padding * 2) / (BOARD_SIZE - 1);

            let c = Math.round((x - padding) / cellSize);
            let r = Math.round((y - padding) / cellSize);

            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                if (!board[r][c]) {
                    makeMove(r, c, 'black');
                }
            }
        });

        function makeMove(r, c, player) {
            board[r][c] = player;
            playSound('click');
            renderBoard();

            if (checkWin(r, c, player)) {
                endGame(player);
                return;
            }

            if (checkDraw()) {
                endGame('draw');
                return;
            }

            if (player === 'black') {
                turn = 'white';
                isAiTurn = true;
                statusDisplay.textContent = "Computer is thinking...";
                let delay = difficulty === 'easy' ? 400 : difficulty === 'medium' ? 600 : 800;
                setTimeout(aiMove, delay);
            } else {
                turn = 'black';
                isAiTurn = false;
                statusDisplay.textContent = "Your turn (Black Stones)";
            }
        }

        function aiMove() {
            if (!isGameActive) return;

            let bestMove = findBestMove('white');
            if (!bestMove) {
                bestMove = findBestMove('black'); // block player win
            }
            if (!bestMove) {
                // Pick random empty spot near center or available
                let emptySpots = [];
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (!board[r][c]) emptySpots.push({ r, c });
                    }
                }
                if (emptySpots.length > 0) {
                    bestMove = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                }
            }

            if (bestMove) {
                makeMove(bestMove.r, bestMove.c, 'white');
            }
        }

        function findBestMove(player) {
            // Simple heuristic to find winning or blocking spots
            let dirs = [{dr:0, dc:1}, {dr:1, dc:0}, {dr:1, dc:1}, {dr:1, dc:-1}];

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (!board[r][c]) {
                        // Test move
                        board[r][c] = player;
                        let won = checkWin(r, c, player);
                        board[r][c] = null;
                        if (won) return { r, c };
                    }
                }
            }
            return null;
        }

        function checkWin(r, c, player) {
            let dirs = [
                {dr: 0, dc: 1},  // horizontal
                {dr: 1, dc: 0},  // vertical
                {dr: 1, dc: 1},  // diagonal down-right
                {dr: 1, dc: -1}  // diagonal down-left
            ];

            for (let d of dirs) {
                let count = 1;
                // Check forward
                let step = 1;
                while (true) {
                    let nr = r + d.dr * step;
                    let nc = c + d.dc * step;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                        count++;
                        step++;
                    } else {
                        break;
                    }
                }
                // Check backward
                step = 1;
                while (true) {
                    let nr = r - d.dr * step;
                    let nc = c - d.dc * step;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                        count++;
                        step++;
                    } else {
                        break;
                    }
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function checkDraw() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (!board[r][c]) return false;
                }
            }
            return true;
        }

        function endGame(winner) {
            isGameActive = false;
            if (winner === 'black') {
                playSound('win');
                modalTitle.textContent = "You Win!";
                modalMessage.textContent = "Brilliant strategy! You successfully connected 5 stones!";
            } else if (winner === 'white') {
                playSound('lose');
                modalTitle.textContent = "Computer Wins!";
                modalMessage.textContent = "The computer connected 5 stones first! Try again.";
            } else {
                playSound('click');
                modalTitle.textContent = "It's a Draw!";
                modalMessage.textContent = "The board is full with no winner.";
            }
            resultModal.classList.remove('hidden');
            statusDisplay.textContent = "Game Over";
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
