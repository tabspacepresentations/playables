<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {

    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation - Appended inside full-screen container */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">
                    <img src="../../../images/logo.png" alt="Tabspace Presentations Logo" class="h-16 md:h-20 w-auto object-contain block opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ Tic Tac Toe</span>
            </div>
            <nav class="hidden md:flex items-center gap-3 text-base">
                <a href="../../" class="btn-card playables-hover text-white px-5 py-2.5 text-sm">Back to Playables</a>
            </nav>
        </div>
    </header>

    <!-- HEADER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-3 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- MAIN GAME CONTAINER (Target for Fullscreen & Houses the Modal) -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">Tic Tac Toe</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Your turn (X)</p>
        </div>

        <!-- Difficulty Controls Only -->
        <div class="flex items-center gap-2 bg-zinc-900/60 p-1.5 rounded-xl border border-zinc-800">
            <button onclick="setDifficulty('easy')" id="btn-easy" class="px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all">Easy</button>
            <button onclick="setDifficulty('medium')" id="btn-medium" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Medium</button>
            <button onclick="setDifficulty('hard')" id="btn-hard" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Hard</button>
        </div>

        <!-- Board Grid -->
        <div class="grid grid-cols-3 gap-3 w-full max-w-[360px] aspect-square card-section p-4">
            <button onclick="makeMove(0)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-0"></button>
            <button onclick="makeMove(1)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-1"></button>
            <button onclick="makeMove(2)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-2"></button>
            <button onclick="makeMove(3)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-3"></button>
            <button onclick="makeMove(4)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-4"></button>
            <button onclick="makeMove(5)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-5"></button>
            <button onclick="makeMove(6)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-6"></button>
            <button onclick="makeMove(7)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-7"></button>
            <button onclick="makeMove(8)" class="bg-zinc-900/80 border border-zinc-800 rounded-xl text-4xl md:text-6xl flex items-center justify-center text-white hover:border-brand-green transition-all" id="cell-8"></button>
        </div>

        <!-- Action Controls: Restart & Fullscreen Toggle side-by-side below the board -->
        <div class="flex items-center gap-3">
            <button onclick="resetGame()" class="cta-btn-green px-6 py-2.5 text-sm">Restart Game</button>
            <button onclick="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">
                <span>Fullscreen</span> ⛶
            </button>
        </div>

        <!-- RESULT POPUP MODAL (Placed inside #game-container so it renders properly in Fullscreen) -->
        <div id="result-modal" class="absolute inset-0 z-50 flex items-center justify-center modal-backdrop hidden rounded-xl">
            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl animate-in fade-in zoom-in duration-200">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Game Over</h2>
                <p id="modal-message" class="text-zinc-300 text-base">Result message goes here</p>
                <div>
                    <button onclick="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-3 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & WEB AUDIO API SCRIPT -->
    <script>
        // Web Audio API Synthesizer for lightweight zero-asset sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'draw') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(200, now + 0.3);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Fullscreen Toggle Logic
        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }

        // Update Fullscreen Button Text on change
        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        let board = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        let difficulty = "easy";
        let isAiTurn = false;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const statusDisplay = document.getElementById('game-status');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });
            resetGame();
        }

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive || isAiTurn) return;

            board[index] = "X";
            document.getElementById(`cell-${index}`).textContent = "X";
            playSound('click');
            
            if (checkGameOver("X")) return;

            isAiTurn = true;
            statusDisplay.textContent = "Computer is thinking...";
            setTimeout(aiMove, 400);
        }

        function aiMove() {
            if (!isGameActive) return;

            let move;
            if (difficulty === "easy") {
                move = getRandomMove();
            } else if (difficulty === "medium") {
                move = Math.random() < 0.5 ? getBestMove() : getRandomMove();
            } else {
                move = getBestMove();
            }

            if (move !== undefined) {
                board[move] = "O";
                document.getElementById(`cell-${move}`).textContent = "O";
                playSound('click');
            }

            if (!checkGameOver("O")) {
                isAiTurn = false;
                statusDisplay.textContent = "Your turn (X)";
            }
        }

        function getRandomMove() {
            let emptyCells = [];
            board.forEach((val, idx) => {
                if (val === "") emptyCells.push(idx);
            });
            if (emptyCells.length === 0) return undefined;
            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let bestMove;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        let scores = {
            O: 10,
            X: -10,
            tie: 0
        };

        function minimax(currBoard, depth, isMaximizing) {
            let result = checkWinState(currBoard);
            if (result !== null) {
                return scores[result];
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currBoard[i] === "") {
                        currBoard[i] = "O";
                        let score = minimax(currBoard, depth + 1, false);
                        currBoard[i] = "";
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currBoard[i] === "") {
                        currBoard[i] = "X";
                        let score = minimax(currBoard, depth + 1, true);
                        currBoard[i] = "";
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function checkWinState(b) {
            for (let i = 0; i < winningConditions.length; i++) {
                const [x, y, z] = winningConditions[i];
                if (b[x] && b[x] === b[y] && b[x] === b[z]) {
                    return b[x];
                }
            }
            if (!b.includes("")) {
                return "tie";
            }
            return null;
        }

        function checkGameOver(player) {
            let res = checkWinState(board);
            if (res !== null) {
                isGameActive = false;
                if (res === "tie") {
                    modalTitle.textContent = "It's a Draw!";
                    modalMessage.textContent = "Well played, but nobody won this round.";
                    playSound('draw');
                } else if (res === "X") {
                    modalTitle.textContent = "You Win!";
                    modalMessage.textContent = "Congratulations! You beat the computer.";
                    playSound('win');
                } else {
                    modalTitle.textContent = "Computer Wins!";
                    modalMessage.textContent = "Better luck next time! Try an easier difficulty.";
                    playSound('lose');
                }
                resultModal.classList.remove("hidden");
                statusDisplay.textContent = "Game Over";
                return true;
            }
            return false;
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add("hidden");
            resetGame();
        }

        function resetGame() {
            playSound('click');
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            isAiTurn = false;
            statusDisplay.textContent = "Your turn (X)";

            for (let i = 0; i < 9; i++) {
                document.getElementById(`cell-${i}`).textContent = "";
            }
        }
    </script>
</body>
