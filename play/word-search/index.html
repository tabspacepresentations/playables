<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>Word Search - Tabspace Playables</title>
    <meta name="description" content="Play classic Word Search online for free on Tabspace Playables. Find hidden words in the grid and beat the timer on desktop and mobile.">
    <meta name="keywords" content="Word Search online, word find game, play word search free, puzzle games online, Tabspace Playables, word puzzle">
    <link rel="canonical" href="https://tabspacepresentations.com/playables/play/word-search">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Word Search - Tabspace Playables">
    <meta property="og:description" content="Challenge yourself with the classic Word Search puzzle. Tap letters to find hidden words and clear the board!">
    <meta property="og:url" content="https://tabspacepresentations.com/playables/play/word-search">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6D00',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
            touch-action: manipulation;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }

        .word-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            background-color: #27272a;
            border-radius: 6px;
            font-size: 1.1rem;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .word-cell:active {
            transform: scale(0.92);
        }
        .word-cell.selected {
            background-color: #15803d !important;
            color: white;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }
        .word-cell.found {
            background-color: #047857 !important;
            color: #a7f3d0;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">
                    <img src="../../../images/logo.png" alt="Tabspace Presentations Logo" class="h-16 md:h-20 w-auto object-contain block opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ Word Search</span>
            </div>
            <nav class="hidden md:flex items-center gap-3 text-base">
                <a href="../../" class="btn-card playables-hover text-white px-5 py-2.5 text-sm">Back to Playables</a>
            </nav>
        </div>
    </header>

    <!-- HEADER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">Word Search</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Tap first letter, then tap last letter of a word.</p>
        </div>

        <!-- Difficulty Controls -->
        <div class="flex items-center gap-2 bg-zinc-900/60 p-1.5 rounded-xl border border-zinc-800">
            <button type="button" onclick="setDifficulty('easy')" id="btn-easy" class="px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold">Easy</button>
            <button type="button" onclick="setDifficulty('medium')" id="btn-medium" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Medium</button>
            <button type="button" onclick="setDifficulty('hard')" id="btn-hard" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Hard</button>
        </div>

        <!-- Word List Container -->
        <div id="word-list" class="flex flex-wrap gap-2 justify-center max-w-[540px] px-2 text-xs md:text-sm">
            <!-- Dynamically populated word chips -->
        </div>

        <!-- Word Search Board Grid (10x10) -->
        <div id="wordsearch-board" class="grid grid-cols-10 w-full max-w-[420px] aspect-square card-section p-2 bg-zinc-900/90 gap-1.5 bg-zinc-700 select-none">
            <!-- Dynamically generated via JS -->
        </div>

        <!-- Action Controls -->
        <div class="flex gap-2 justify-center pt-2">
            <button type="button" onclick="resetGame()" class="cta-btn-green px-6 py-2 text-sm">New Game</button>
            <button type="button" onclick="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">
                <span>Fullscreen</span> ⛶
            </button>
        </div>

        <!-- RESULT POPUP MODAL -->
        <div id="result-modal" class="absolute inset-0 z-50 flex items-center justify-center modal-backdrop hidden rounded-xl">
            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Puzzle Completed!</h2>
                <p id="modal-message" class="text-zinc-300 text-base">You found all the words!</p>
                <div>
                    <button type="button" onclick="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'match') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            }
        }

        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        const GRID_SIZE = 10;
        let board = [];
        let wordsToFind = [];
        let foundWords = [];
        let difficulty = 'easy';
        let isGameActive = true;

        let firstSelectedCell = null;
        let foundCoordinates = new Set();

        const wordBank = {
            easy: ["HTML", "CSS", "CODE", "WEB", "SITE", "APP"],
            medium: ["JAVASCRIPT", "PYTHON", "REACT", "TAILWIND", "NODE", "DESIGN"],
            hard: ["ALGORITHM", "FRAMEWORK", "DATABASE", "DEVELOPER", "TYPESCRIPT", "RESPONSIVE"]
        };

        const boardElement = document.getElementById('wordsearch-board');
        const wordListElement = document.getElementById('word-list');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const statusDisplay = document.getElementById('game-status');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });
            resetGame();
        }

        function resetGame() {
            playSound('click');
            isGameActive = true;
            foundWords = [];
            foundCoordinates = new Set();
            firstSelectedCell = null;
            
            wordsToFind = [...wordBank[difficulty]];
            generateGrid();
            renderWordList();
            renderBoard();
            statusDisplay.textContent = `Tap first letter, then tap last letter of a word.`;
        }

        function generateGrid() {
            board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));

            wordsToFind.forEach(word => {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 100) {
                    attempts++;
                    const direction = Math.floor(Math.random() * 3);
                    const row = Math.floor(Math.random() * GRID_SIZE);
                    const col = Math.floor(Math.random() * GRID_SIZE);

                    let dr = 0, dc = 0;
                    if (direction === 0) dc = 1;
                    else if (direction === 1) dr = 1;
                    else { dr = 1; dc = 1; }

                    if (row + dr * (word.length - 1) >= 0 && row + dr * (word.length - 1) < GRID_SIZE &&
                        col + dc * (word.length - 1) >= 0 && col + dc * (word.length - 1) < GRID_SIZE) {
                        
                        let fit = true;
                        for (let i = 0; i < word.length; i++) {
                            let r = row + dr * i;
                            let c = col + dc * i;
                            if (board[r][c] !== '' && board[r][c] !== word[i]) {
                                fit = false;
                                break;
                            }
                        }

                        if (fit) {
                            for (let i = 0; i < word.length; i++) {
                                let r = row + dr * i;
                                let c = col + dc * i;
                                board[r][c] = word[i];
                            }
                            placed = true;
                        }
                    }
                }
            });

            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === '') {
                        board[r][c] = letters[Math.floor(Math.random() * letters.length)];
                    }
                }
            }
        }

        function renderWordList() {
            wordListElement.innerHTML = '';
            wordsToFind.forEach(word => {
                const chip = document.createElement('span');
                const isFound = foundWords.includes(word);
                chip.className = `px-3 py-1 rounded-lg border text-xs md:text-sm transition-all ${isFound ? 'bg-emerald-950/60 border-emerald-600 text-emerald-400 line-through' : 'bg-zinc-900 border-zinc-800 text-zinc-300'}`;
                chip.textContent = word;
                wordListElement.appendChild(chip);
            });
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    let classes = "word-cell aspect-square text-sm md:text-base font-bold select-none";
                    
                    const coordKey = `${r},${c}`;
                    if (foundCoordinates.has(coordKey)) {
                        classes += " found";
                    } else if (firstSelectedCell && firstSelectedCell.r === r && firstSelectedCell.c === c) {
                        classes += " selected";
                    }

                    cell.className = classes;
                    cell.textContent = board[r][c];

                    cell.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        handleCellInteraction(r, c);
                    });

                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellInteraction(r, c) {
            if (!isGameActive) return;
            playSound('click');

            if (!firstSelectedCell) {
                firstSelectedCell = {r, c};
                statusDisplay.textContent = `Selected (${board[r][c]}). Now tap the last letter!`;
                renderBoard();
            } else {
                const start = firstSelectedCell;
                const end = {r, c};
                firstSelectedCell = null;

                const dr = end.r - start.r;
                const dc = end.c - start.c;

                let stepR = 0, stepC = 0, steps = 0;
                if (dr === 0) {
                    stepC = dc > 0 ? 1 : -1;
                    steps = Math.abs(dc);
                } else if (dc === 0) {
                    stepR = dr > 0 ? 1 : -1;
                    steps = Math.abs(dr);
                } else if (Math.abs(dr) === Math.abs(dc)) {
                    stepR = dr > 0 ? 1 : -1;
                    stepC = dc > 0 ? 1 : -1;
                    steps = Math.abs(dr);
                } else {
                    statusDisplay.textContent = "Invalid line! Pick straight or diagonal letters.";
                    renderBoard();
                    return;
                }

                let lineCells = [];
                for (let i = 0; i <= steps; i++) {
                    lineCells.push({
                        r: start.r + stepR * i,
                        c: start.c + stepC * i
                    });
                }

                const selectedWord = lineCells.map(cell => board[cell.r][cell.c]).join('');
                const reversedWord = selectedWord.split('').reverse().join('');

                let matchedWord = null;
                if (wordsToFind.includes(selectedWord) && !foundWords.includes(selectedWord)) {
                    matchedWord = selectedWord;
                } else if (wordsToFind.includes(reversedWord) && !foundWords.includes(reversedWord)) {
                    matchedWord = reversedWord;
                }

                if (matchedWord) {
                    foundWords.push(matchedWord);
                    lineCells.forEach(cell => foundCoordinates.add(`${cell.r},${cell.c}`));
                    playSound('match');
                    renderWordList();
                    statusDisplay.textContent = `Found word: ${matchedWord}!`;

                    if (foundWords.length === wordsToFind.length) {
                        endGame();
                        return;
                    }
                } else {
                    statusDisplay.textContent = "Not a valid word! Try again.";
                }

                renderBoard();
            }
        }

        function endGame() {
            isGameActive = false;
            playSound('win');
            modalTitle.textContent = "Puzzle Completed!";
            modalMessage.textContent = "Fantastic job finding all the hidden words!";
            resultModal.classList.remove('hidden');
            statusDisplay.textContent = "All words found!";
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
</body>
</html>
