<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>Connect Four - Tabspace Playables</title>
    <meta name="description" content="Play classic Connect Four online for free on Tabspace Playables. Drop pieces to connect four in a row on desktop and mobile.">
    <meta name="keywords" content="Connect Four online, four in a row game, play connect four free, board games online, Tabspace Playables, strategy puzzle game">
    <link rel="canonical" href="https://tabspacepresentations.com/playables/play/connect-four">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Connect Four - Tabspace Playables">
    <meta property="og:description" content="Challenge yourself with classic Connect Four. Drop your colored pieces and connect four in a row to win!">
    <meta property="og:url" content="https://tabspacepresentations.com/playables/play/connect-four">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6D00',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
            touch-action: manipulation;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }

        .connect-cell {
            width: 100%;
            aspect-ratio: 1;
            background-color: #27272a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
            transition: background-color 0.15s ease;
        }
        .connect-piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }
        .connect-piece.orange {
            background: radial-gradient(circle at 30% 30%, #ff9100 0%, #ff6D00 100%);
            border: 2px solid #b44c00;
        }
        .connect-piece.blue {
            background: radial-gradient(circle at 30% 30%, #3b82f6 0%, #2563eb 100%);
            border: 2px solid #1d4ed8;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">
                    <img src="../../images/logo.png" alt="Tabspace Presentations Logo" class="h-16 md:h-20 w-auto object-contain block opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ Connect Four</span>
            </div>
            <nav class="hidden md:flex items-center gap-3 text-base">
                <a href="../../" class="btn-card playables-hover text-white px-5 py-2.5 text-sm">Back to Playables</a>
            </nav>
        </div>
    </header>

    <!-- HEADER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">Connect Four</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Your turn (Orange Pieces)</p>
        </div>

        <!-- Difficulty Controls Only -->
        <div class="flex items-center gap-2 bg-zinc-900/60 p-1.5 rounded-xl border border-zinc-800">
            <button type="button" onpointerdown="setDifficulty('easy')" id="btn-easy" class="px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold">Easy</button>
            <button type="button" onpointerdown="setDifficulty('medium')" id="btn-medium" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Medium</button>
            <button type="button" onpointerdown="setDifficulty('hard')" id="btn-hard" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Hard</button>
        </div>

        <!-- Connect Four Board Grid (6 rows x 7 cols) Restored Classic Blue Board Aesthetic -->
        <div id="connect-board" class="grid grid-cols-7 w-full max-w-[500px] card-section p-3 bg-blue-700 gap-2 border border-blue-600 shadow-2xl">
            <!-- Dynamically generated via JS -->
        </div>

        <!-- Action Controls -->
        <div class="flex gap-2 justify-center pt-2">
            <button type="button" onpointerdown="resetGame()" class="cta-btn-green px-6 py-2 text-sm">New Game</button>
            <button type="button" onpointerdown="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">
                <span>Fullscreen</span> ⛶
            </button>
        </div>

        <!-- RESULT POPUP MODAL -->
        <div id="result-modal" class="absolute inset-0 z-50 flex items-center justify-center modal-backdrop hidden rounded-xl">
            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Game Over</h2>
                <p id="modal-message" class="text-zinc-300 text-base">Game concluded.</p>
                <div>
                    <button type="button" onpointerdown="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // Fullscreen Toggle Logic
        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        const rows = 6;
        const cols = 7;
        let board = [];
        let turn = 'orange'; // 'orange' (player), 'blue' (AI)
        let isGameActive = true;
        let difficulty = 'easy';
        let isAiTurn = false;

        const boardElement = document.getElementById('connect-board');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const statusDisplay = document.getElementById('game-status');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });
            resetGame();
        }

        function resetGame() {
            playSound('click');
            board = Array(rows).fill(null).map(() => Array(cols).fill(''));
            turn = 'orange';
            isGameActive = true;
            isAiTurn = false;
            statusDisplay.textContent = "Your turn (Orange Pieces)";
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = "connect-cell";
                    cell.onpointerdown = (e) => {
                        e.preventDefault();
                        handleColumnClick(c);
                    };

                    const p = board[r][c];
                    if (p !== '') {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `connect-piece ${p}`;
                        cell.appendChild(pieceDiv);
                    }

                    boardElement.appendChild(cell);
                }
            }
        }

        function handleColumnClick(col) {
            if (!isGameActive || isAiTurn || turn !== 'orange') return;

            let targetRow = -1;
            for (let r = rows - 1; r >= 0; r--) {
                if (board[r][col] === '') {
                    targetRow = r;
                    break;
                }
            }

            if (targetRow === -1) return;

            executeMove(targetRow, col, 'orange');

            if (checkWin('orange')) {
                endGame('orange');
                return;
            }
            if (checkDraw()) {
                endGame('draw');
                return;
            }

            turn = 'blue';
            isAiTurn = true;
            statusDisplay.textContent = "Computer is thinking...";
            setTimeout(aiMove, 600);
        }

        function executeMove(r, c, player) {
            board[r][c] = player;
            playSound('drop');
            renderBoard();
        }

        function aiMove() {
            if (!isGameActive) return;

            let availableCols = [];
            for (let c = 0; c < cols; c++) {
                if (board[0][c] === '') availableCols.push(c);
            }

            if (availableCols.length === 0) {
                endGame('draw');
                return;
            }

            let chosenCol = availableCols[Math.floor(Math.random() * availableCols.length)];

            if (difficulty !== 'easy') {
                let winningCol = findWinningMove('blue');
                let blockingCol = findWinningMove('orange');

                if (winningCol !== -1) {
                    chosenCol = winningCol;
                } else if (blockingCol !== -1) {
                    chosenCol = blockingCol;
                } else if (difficulty === 'hard') {
                    if (availableCols.includes(3)) chosenCol = 3;
                    else if (availableCols.includes(2)) chosenCol = 2;
                    else if (availableCols.includes(4)) chosenCol = 4;
                }
            }

            let targetRow = -1;
            for (let r = rows - 1; r >= 0; r--) {
                if (board[r][chosenCol] === '') {
                    targetRow = r;
                    break;
                }
            }

            executeMove(targetRow, chosenCol, 'blue');

            if (checkWin('blue')) {
                endGame('blue');
                return;
            }
            if (checkDraw()) {
                endGame('draw');
                return;
            }

            turn = 'orange';
            isAiTurn = false;
            statusDisplay.textContent = "Your turn (Orange Pieces)";
        }

        function findWinningMove(player) {
            for (let c = 0; c < cols; c++) {
                let targetRow = -1;
                for (let r = rows - 1; r >= 0; r--) {
                    if (board[r][c] === '') {
                        targetRow = r;
                        break;
                    }
                }
                if (targetRow !== -1) {
                    board[targetRow][c] = player;
                    let wins = checkWin(player);
                    board[targetRow][c] = '';
                    if (wins) return c;
                }
            }
            return -1;
        }

        function checkWin(player) {
            // Horizontal
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols - 3; c++) {
                    if (board[r][c] === player && board[r][c+1] === player && board[r][c+2] === player && board[r][c+3] === player) return true;
                }
            }
            // Vertical
            for (let r = 0; r < rows - 3; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] === player && board[r+1][c] === player && board[r+2][c] === player && board[r+3][c] === player) return true;
                }
            }
            // Diagonal Down-Right
            for (let r = 0; r < rows - 3; r++) {
                for (let c = 0; c < cols - 3; c++) {
                    if (board[r][c] === player && board[r+1][c+1] === player && board[r+2][c+2] === player && board[r+3][c+3] === player) return true;
                }
            }
            // Diagonal Up-Right
            for (let r = 3; r < rows; r++) {
                for (let c = 0; c < cols - 3; c++) {
                    if (board[r][c] === player && board[r-1][c+1] === player && board[r-2][c+2] === player && board[r-3][c+3] === player) return true;
                }
            }
            return false;
        }

        function checkDraw() {
            for (let c = 0; c < cols; c++) {
                if (board[0][c] === '') return false;
            }
            return true;
        }

        function endGame(winner) {
            isGameActive = false;
            if (winner === 'orange') {
                modalTitle.textContent = "You Win!";
                modalMessage.textContent = "Fantastic strategy! You connected four!";
                playSound('win');
            } else if (winner === 'blue') {
                modalTitle.textContent = "Computer Wins!";
                modalMessage.textContent = "Better luck next time! Try an easier difficulty.";
                playSound('lose');
            } else {
                modalTitle.textContent = "It's a Draw!";
                modalMessage.textContent = "The board is completely full!";
                playSound('click');
            }
            resultModal.classList.remove('hidden');
            statusDisplay.textContent = "Game Over";
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
</body>
</html>
