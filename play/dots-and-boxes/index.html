    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {

    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
            touch-action: manipulation;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }

        .dot {
            width: 14px;
            height: 14px;
            background-color: #a1a1aa;
            border-radius: 50%;
            z-index: 10;
        }
        .line-h {
            height: 10px;
            cursor: pointer;
            background-color: #27272a;
            border-radius: 5px;
            transition: background-color 0.15s ease;
        }
        .line-h:hover {
            background-color: #52525b;
        }
        .line-h.active {
            background-color: #ff6D00;
        }
        .line-h.active-blue {
            background-color: #3b82f6;
        }

        .line-v {
            width: 10px;
            cursor: pointer;
            background-color: #27272a;
            border-radius: 5px;
            transition: background-color 0.15s ease;
        }
        .line-v:hover {
            background-color: #52525b;
        }
        .line-v.active {
            background-color: #ff6D00;
        }
        .line-v.active-blue {
            background-color: #3b82f6;
        }

        .box-cell {
            background-color: #18181b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">

            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">

                </div>

            <nav class="hidden md:flex items-center gap-3 text-base">

    <!-- HEADER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">

    <!-- MAIN GAME CONTAINER -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">Dots and Boxes</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Your turn (Orange Player)</p>
        </div>

        <!-- Scores & Difficulty Controls -->
        <div class="flex flex-wrap items-center justify-center gap-4 bg-zinc-900/60 px-5 py-2.5 rounded-xl border border-zinc-800 text-xs md:text-sm">
            <div>Orange: <strong id="score-orange" class="text-brand-orange">0</strong></div>
            <div class="h-4 w-[1px] bg-zinc-700"></div>

                <button type="button" onpointerdown="setDifficulty('easy')" id="btn-easy" class="px-3 py-1 rounded-lg text-xs bg-brand-green text-black transition-all font-bold">Easy</button>
                <button type="button" onpointerdown="setDifficulty('medium')" id="btn-medium" class="px-3 py-1 rounded-lg text-xs text-zinc-400 hover:text-white transition-all">Medium</button>
                <button type="button" onpointerdown="setDifficulty('hard')" id="btn-hard" class="px-3 py-1 rounded-lg text-xs text-zinc-400 hover:text-white transition-all">Hard</button>
            </div>

        <!-- Game Board Container -->
        <div class="card-section p-6 bg-zinc-900/90 border border-zinc-700 shadow-xl relative overflow-hidden flex flex-col items-center justify-center w-full max-w-[440px] space-y-6">
            
            <!-- Grid Board Area -->
            <div id="grid-board" class="relative bg-zinc-950 p-4 rounded-xl border border-zinc-800 flex flex-col items-center justify-center overflow-x-auto w-full">

            </div>

            <!-- Action Controls -->
            <div class="flex gap-2 justify-center pt-2 w-full border-t border-zinc-800">
                <button type="button" onpointerdown="resetGame()" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm">New Game</button>
                <button type="button" onpointerdown="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">
                    <span>Fullscreen</span> ⛶
                </button>
            </div>
        </div>

        <!-- RESULT POPUP MODAL -->
        <div id="result-modal" class="absolute inset-0 z-50 flex items-center justify-center modal-backdrop hidden rounded-xl">
            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Game Over</h2>
                <p id="modal-message" class="text-zinc-300 text-base">Game concluded.</p>
                <div>
                    <button type="button" onpointerdown="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'box') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(750, now + 0.12);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // Fullscreen Toggle Logic
        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        let gridSize = 3; // 3x3 boxes default (Easy)
        let difficulty = 'easy';
        let hLines = [];
        let vLines = [];
        let boxes = [];
        let turn = 'orange'; // 'orange' (player) or 'blue' (computer)
        let scoreOrange = 0;
        let scoreBlue = 0;
        let isGameActive = true;

        const gridBoard = document.getElementById('grid-board');
        const scoreOrangeEl = document.getElementById('score-orange');
        const scoreBlueEl = document.getElementById('score-blue');
        const gameStatus = document.getElementById('game-status');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-3 py-1 rounded-lg text-xs bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-3 py-1 rounded-lg text-xs text-zinc-400 hover:text-white transition-all";
                }
            });

            if (level === 'easy') gridSize = 3;
            else if (level === 'medium') gridSize = 4;
            else if (level === 'hard') gridSize = 5;

            resetGame();
        }

        function resetGame() {
            playSound('click');
            hLines = Array(gridSize + 1).fill(null).map(() => Array(gridSize).fill(false));
            vLines = Array(gridSize).fill(null).map(() => Array(gridSize + 1).fill(false));
            boxes = Array(gridSize).fill(null).map(() => Array(gridSize).fill(null));
            turn = 'orange';
            scoreOrange = 0;
            scoreBlue = 0;
            isGameActive = true;
            resultModal.classList.add('hidden');
            renderBoard();
        }

        function renderBoard() {
            scoreOrangeEl.textContent = scoreOrange;
            scoreBlueEl.textContent = scoreBlue;

            gridBoard.innerHTML = '';
            let gridContainer = document.createElement('div');
            gridContainer.className = "grid gap-1";
            gridContainer.style.gridTemplateColumns = `repeat(${gridSize * 2 + 1}, auto)`;

            let lineLength = gridSize === 5 ? 'w-8 h-8 md:w-10 md:h-10' : (gridSize === 4 ? 'w-10 h-10 md:w-12 md:h-12' : 'w-12 h-12 md:w-16 md:h-16');

            for (let r = 0; r <= gridSize; r++) {
                for (let c = 0; c <= gridSize; c++) {
                    // Dot
                    let dot = document.createElement('div');
                    dot.className = "dot";
                    gridContainer.appendChild(dot);

                    // Horizontal Line (if not last column)
                    if (c < gridSize) {
                        let hLine = document.createElement('div');
                        hLine.className = `line-h ${gridSize === 5 ? 'w-8 md:w-10' : (gridSize === 4 ? 'w-10 md:w-12' : 'w-12 md:w-16')}`;
                        if (hLines[r][c]) {
                            hLine.classList.add(hLines[r][c] === 'blue' ? 'active-blue' : 'active');
                        }
                        hLine.onpointerdown = (e) => {
                            e.preventDefault();
                            handleLineClick('h', r, c);
                        };
                        gridContainer.appendChild(hLine);
                    }
                }

                // Vertical lines and box cells row (if not last row)
                if (r < gridSize) {
                    for (let c = 0; c <= gridSize; c++) {
                        let vLine = document.createElement('div');
                        vLine.className = `line-v ${gridSize === 5 ? 'h-8 md:h-10' : (gridSize === 4 ? 'h-10 md:h-12' : 'h-12 md:h-16')}`;
                        if (vLines[r][c]) {
                            vLine.classList.add(vLines[r][c] === 'blue' ? 'active-blue' : 'active');
                        }
                        vLine.onpointerdown = (e) => {
                            e.preventDefault();
                            handleLineClick('v', r, c);
                        };
                        gridContainer.appendChild(vLine);

                        // Box cell (if not last column)
                        if (c < gridSize) {
                            let boxCell = document.createElement('div');
                            boxCell.className = `box-cell ${lineLength}`;
                            if (boxes[r][c]) {
                                boxCell.textContent = boxes[r][c] === 'orange' ? 'O' : 'X';
                                boxCell.style.color = boxes[r][c] === 'orange' ? '#ff6D00' : '#3b82f6';
                            }
                            gridContainer.appendChild(boxCell);
                        }
                    }
                }
            }

            gridBoard.appendChild(gridContainer);
        }

        function handleLineClick(type, r, c) {
            if (!isGameActive || turn !== 'orange') return;

            if (type === 'h' && hLines[r][c]) return;
            if (type === 'v' && vLines[r][c]) return;

            playSound('click');
            if (type === 'h') hLines[r][c] = 'orange';
            if (type === 'v') vLines[r][c] = 'orange';

            let scoredBoxes = checkCompletedBoxes(r, c, type, 'orange');

            if (scoredBoxes > 0) {
                scoreOrange += scoredBoxes;
                playSound('box');
                gameStatus.textContent = "You closed a box! Take another turn.";
                renderBoard();
                checkGameOver();
            } else {
                turn = 'blue';
                gameStatus.textContent = "Computer is thinking...";
                renderBoard();
                setTimeout(computerTurn, 700);
            }
        }

        function checkCompletedBoxes(r, c, type, player) {
            let completed = 0;
            if (type === 'h') {
                if (r > 0 && hLines[r-1][c] && vLines[r-1][c] && vLines[r-1][c+1] && !boxes[r-1][c]) {
                    boxes[r-1][c] = player;
                    completed++;
                }
                if (r < gridSize && hLines[r+1] && hLines[r+1][c] && vLines[r][c] && vLines[r][c+1] && !boxes[r][c]) {
                    boxes[r][c] = player;
                    completed++;
                }
            } else {
                if (c > 0 && vLines[r][c-1] && hLines[r][c-1] && hLines[r+1][c-1] && !boxes[r][c-1]) {
                    boxes[r][c-1] = player;
                    completed++;
                }
                if (c < gridSize && vLines[r][c+1] && hLines[r][c] && hLines[r+1][c] && !boxes[r][c]) {
                    boxes[r][c] = player;
                    completed++;
                }
            }
            return completed;
        }

        function countBoxSides(boxR, boxC, testHLines, testVLines) {
            let sides = 0;
            if (testHLines[boxR][boxC]) sides++;
            if (testHLines[boxR+1][boxC]) sides++;
            if (testVLines[boxR][boxC]) sides++;
            if (testVLines[boxR][boxC+1]) sides++;
            return sides;
        }

        function computerTurn() {
            if (!isGameActive) return;

            let available = [];
            for (let r = 0; r <= gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (!hLines[r][c]) available.push({ type: 'h', r, c });
                }
            }
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c <= gridSize; c++) {
                    if (!vLines[r][c]) available.push({ type: 'v', r, c });
                }
            }

            if (available.length === 0) return;

            let chosen = null;

            // 1. Try to find a scoring move (completing a box with 3 sides already filled)
            for (let line of available) {
                let testHLines = hLines.map(row => [...row]);
                let testVLines = vLines.map(row => [...row]);
                if (line.type === 'h') testHLines[line.r][line.c] = 'blue';
                else testVLines[line.r][line.c] = 'blue';

                let testBoxes = boxes.map(row => [...row]);
                let scores = 0;
                if (line.type === 'h') {
                    if (line.r > 0 && testHLines[line.r-1][line.c] && testVLines[line.r-1][line.c] && testVLines[line.r-1][line.c+1] && !testBoxes[line.r-1][line.c]) scores++;
                    if (line.r < gridSize && testHLines[line.r+1][line.c] && testVLines[line.r][line.c] && testVLines[line.r][line.c+1] && !testBoxes[line.r][line.c]) scores++;
                } else {
                    if (line.c > 0 && testVLines[line.r][line.c-1] && testHLines[line.r][line.c-1] && testHLines[line.r+1][line.c-1] && !testBoxes[line.r][line.c-1]) scores++;
                    if (line.c < gridSize && testVLines[line.r][line.c+1] && testHLines[line.r][line.c] && testHLines[line.r+1][line.c] && !testBoxes[line.r][line.c]) scores++;
                }

                if (scores > 0) {
                    chosen = line;
                    break;
                }
            }

            // 2. If Medium or Hard, avoid giving away 3rd side to opponent if possible
            if (!chosen && (difficulty === 'medium' || difficulty === 'hard')) {
                let safeMoves = [];
                for (let line of available) {
                    let testHLines = hLines.map(row => [...row]);
                    let testVLines = vLines.map(row => [...row]);
                    if (line.type === 'h') testHLines[line.r][line.c] = 'blue';
                    else testVLines[line.r][line.c] = 'blue';

                    // Check if this move results in any box having 3 sides filled (giving point to opponent)
                    let givesThirdSide = false;
                    for (let br = 0; br < gridSize; br++) {
                        for (let bc = 0; bc < gridSize; bc++) {
                            if (!boxes[br][bc] && countBoxSides(br, bc, testHLines, testVLines) === 3) {
                                givesThirdSide = true;
                            }
                        }
                    }

                    if (!givesThirdSide) {
                        safeMoves.push(line);
                    }
                }

                if (safeMoves.length > 0) {
                    chosen = safeMoves[Math.floor(Math.random() * safeMoves.length)];
                }
            }

            // Fallback to random move
            if (!chosen) {
                chosen = available[Math.floor(Math.random() * available.length)];
            }

            if (chosen.type === 'h') hLines[chosen.r][chosen.c] = 'blue';
            else vLines[chosen.r][chosen.c] = 'blue';

            let scoredBoxes = checkCompletedBoxes(chosen.r, chosen.c, chosen.type, 'blue');

            if (scoredBoxes > 0) {
                scoreBlue += scoredBoxes;
                playSound('box');
                gameStatus.textContent = "Computer closed a box and plays again!";
                renderBoard();
                checkGameOver();
                if (isGameActive && turn === 'blue') {
                    setTimeout(computerTurn, 800);
                }
            } else {
                turn = 'orange';
                gameStatus.textContent = "Your turn (Orange Player)";
                renderBoard();
                checkGameOver();
            }
        }

        function checkGameOver() {
            let totalBoxes = gridSize * gridSize;
            if (scoreOrange + scoreBlue === totalBoxes) {
                isGameActive = false;
                if (scoreOrange > scoreBlue) {
                    modalTitle.textContent = "You Win!";
                    modalMessage.textContent = `Fantastic victory! You captured ${scoreOrange} boxes!`;
                    playSound('win');
                } else if (scoreBlue > scoreOrange) {
                    modalTitle.textContent = "Computer Wins!";
                    modalMessage.textContent = `Computer captured ${scoreBlue} boxes. Try again!`;
                    playSound('lose');
                } else {
                    modalTitle.textContent = "It's a Draw!";
                    modalMessage.textContent = "Both players captured an equal number of boxes!";
                    playSound('click');
                }
                resultModal.classList.remove('hidden');
                gameStatus.textContent = "Game Over";
            }
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
</body>
</html>
