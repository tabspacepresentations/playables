<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>Data Structure Visualizer - Tabspace Playables</title>
    <meta name="description" content="Play Data Structure Visualizer online for free on Tabspace Playables. Interactive computer science learning tool for arrays, stacks, queues, and linked lists.">
    <meta name="keywords" content="Data Structure Visualizer, CS visualizer, play algorithm tool free, programming data structures, Tabspace Playables, computer science game">
    <link rel="canonical" href="https://tabspacepresentations.com/playables/play/data-structure-visualizer">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Data Structure Visualizer - Tabspace Playables">
    <meta property="og:description" content="Explore and visualize core computer science data structures like Arrays, Stacks, and Queues interactively!">
    <meta property="og:url" content="https://tabspacepresentations.com/playables/play/data-structure-visualizer">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6D00',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
            touch-action: manipulation;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }

        .node-box {
            background-color: #27272a;
            border: 2px solid #3f3f46;
            color: #eff1f5;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            min-width: 50px;
            height: 50px;
            transition: all 0.2s ease;
        }
        .node-box.highlight {
            border-color: var(--accent-green);
            background-color: rgba(34, 197, 94, 0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">
                    <img src="../../images/logo.png" alt="Tabspace Presentations Logo" class="h-16 md:h-20 w-auto object-contain block opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ Data Structure Visualizer</span>
            </div>
            <nav class="hidden md:flex items-center gap-3 text-base">
                <a href="../../" class="btn-card playables-hover text-white px-5 py-2.5 text-sm">Back to Playables</a>
            </nav>
        </div>
    </header>

    <!-- HEADER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">Data Structure Visualizer</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Interact with Stacks, Queues, and Arrays in real-time.</p>
        </div>

        <!-- Mode Selector Tabs -->
        <div class="flex items-center gap-2 bg-zinc-900/60 p-1.5 rounded-xl border border-zinc-800">
            <button type="button" onpointerdown="setStructure('stack')" id="btn-stack" class="px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold">Stack (LIFO)</button>
            <button type="button" onpointerdown="setStructure('queue')" id="btn-queue" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Queue (FIFO)</button>
            <button type="button" onpointerdown="setStructure('array')" id="btn-array" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Array</button>
        </div>

        <!-- Game Board Container -->
        <div class="card-section p-6 bg-zinc-900/90 border border-zinc-700 shadow-xl relative overflow-hidden flex flex-col items-center justify-center w-full max-w-[540px] space-y-6">
            
            <!-- Structure Display Area -->
            <div id="visual-area" class="w-full min-h-[140px] bg-zinc-950 border border-zinc-800 rounded-xl p-4 flex flex-wrap items-center justify-center gap-3 overflow-x-auto">
                <!-- Dynamically populated nodes -->
            </div>

            <!-- Input & Operation Controls -->
            <div class="flex items-center gap-2 w-full">
                <input type="number" id="node-value" placeholder="Enter value..." class="flex-grow bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-brand-green font-mono">
                <button type="button" onpointerdown="performPush()" id="primary-action-btn" class="cta-btn-green px-5 py-2.5 text-sm">Push</button>
                <button type="button" onpointerdown="performPop()" id="secondary-action-btn" class="btn-card playables-hover text-white px-5 py-2.5 text-sm">Pop</button>
            </div>

            <!-- Action Controls -->
            <div class="flex gap-2 justify-center pt-2 w-full border-t border-zinc-800">
                <button type="button" onpointerdown="resetStructureData()" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm">Clear</button>
                <button type="button" onpointerdown="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">
                    <span>Fullscreen</span> ⛶
                </button>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'add') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'remove') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Fullscreen Toggle Logic
        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        let currentStructure = 'stack';
        let dataElements = [10, 25, 42];

        const visualArea = document.getElementById('visual-area');
        const nodeValueInput = document.getElementById('node-value');
        const primaryActionBtn = document.getElementById('primary-action-btn');
        const secondaryActionBtn = document.getElementById('secondary-action-btn');
        const gameStatus = document.getElementById('game-status');

        function setStructure(struct) {
            playSound('click');
            currentStructure = struct;
            ['stack', 'queue', 'array'].forEach(s => {
                const btn = document.getElementById(`btn-${s}`);
                if (s === struct) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });

            if (struct === 'stack') {
                primaryActionBtn.textContent = "Push";
                secondaryActionBtn.textContent = "Pop";
                gameStatus.textContent = "Stack (LIFO): Last In, First Out structure.";
            } else if (struct === 'queue') {
                primaryActionBtn.textContent = "Enqueue";
                secondaryActionBtn.textContent = "Dequeue";
                gameStatus.textContent = "Queue (FIFO): First In, First Out structure.";
            } else {
                primaryActionBtn.textContent = "Insert";
                secondaryActionBtn.textContent = "Delete";
                gameStatus.textContent = "Array: Indexed collection of elements.";
            }

            renderVisualization();
        }

        function renderVisualization() {
            visualArea.innerHTML = '';
            if (dataElements.length === 0) {
                visualArea.innerHTML = '<span class="text-zinc-600 text-xs">Structure is empty</span>';
                return;
            }

            dataElements.forEach((val, idx) => {
                const node = document.createElement('div');
                node.className = "node-box";
                if (idx === 0 && currentStructure === 'queue') {
                    node.classList.add('highlight');
                    node.title = "Front of Queue";
                } else if (idx === dataElements.length - 1 && currentStructure === 'stack') {
                    node.classList.add('highlight');
                    node.title = "Top of Stack";
                }
                node.textContent = val;
                visualArea.appendChild(node);
            });
        }

        function performPush() {
            playSound('click');
            let val = parseInt(nodeValueInput.value);
            if (isNaN(val)) {
                val = Math.floor(Math.random() * 90) + 10;
            }

            if (dataElements.length >= 8) {
                gameStatus.textContent = "Structure capacity limit reached!";
                return;
            }

            playSound('add');
            dataElements.push(val);
            nodeValueInput.value = '';
            renderVisualization();
        }

        function performPop() {
            playSound('click');
            if (dataElements.length === 0) {
                gameStatus.textContent = "Structure is already empty!";
                playSound('remove');
                return;
            }

            playSound('remove');
            if (currentStructure === 'stack' || currentStructure === 'array') {
                dataElements.pop();
            } else if (currentStructure === 'queue') {
                dataElements.shift();
            }
            renderVisualization();
        }

        function resetStructureData() {
            playSound('click');
            dataElements = [];
            renderVisualization();
            gameStatus.textContent = "Structure cleared.";
        }

        nodeValueInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                performPush();
            }
        });

        renderVisualization();
    </script>
</body>
</html>
