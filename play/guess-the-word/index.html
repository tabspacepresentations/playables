<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>Guess the Word - Tabspace Playables</title>
    <meta name="description" content="Play classic Guess the Word online for free on Tabspace Playables. Test your vocabulary and deductive skills on desktop and mobile.">
    <meta name="keywords" content="Guess the Word online, word guessing game, play wordle free, puzzle games online, Tabspace Playables, word puzzle">
    <link rel="canonical" href="https://tabspacepresentations.com/playables/play/guess-the-word">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Guess the Word - Tabspace Playables">
    <meta property="og:description" content="Challenge yourself with the classic Guess the Word puzzle. Guess letters, find the hidden word, and win the match!">
    <meta property="og:url" content="https://tabspacepresentations.com/playables/play/guess-the-word">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6D00',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
            touch-action: manipulation;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }

        .wordle-tile {
            width: 44px;
            height: 44px;
            border: 2px solid #3f3f46;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #ffffff;
            background-color: #27272a;
            text-transform: uppercase;
        }
        .wordle-tile.correct {
            background-color: #047857 !important;
            border-color: #059669 !important;
        }
        .wordle-tile.present {
            background-color: #b45309 !important;
            border-color: #d97706 !important;
        }
        .wordle-tile.absent {
            background-color: #3f3f46 !important;
            border-color: #52525b !important;
        }

        .keyboard-key {
            background-color: #3f3f46;
            border: 1px solid #52525b;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.85rem;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }
        .keyboard-key:hover {
            background-color: #52525b;
            border-color: var(--accent-green);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">
                    <img src="../../../images/logo.png" alt="Tabspace Presentations Logo" class="h-16 md:h-20 w-auto object-contain block opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ Guess the Word</span>
            </div>
            <nav class="hidden md:flex items-center gap-3 text-base">
                <a href="../../" class="btn-card playables-hover text-white px-5 py-2.5 text-sm">Back to Playables</a>
            </nav>
        </div>
    </header>

    <!-- HEADER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">Guess the Word</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Guess the 5-letter hidden word in 6 tries!</p>
        </div>

        <!-- Difficulty Controls -->
        <div class="flex items-center gap-2 bg-zinc-900/60 p-1.5 rounded-xl border border-zinc-800">
            <button type="button" onclick="setDifficulty('easy')" id="btn-easy" class="px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold">Easy</button>
            <button type="button" onclick="setDifficulty('medium')" id="btn-medium" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Medium</button>
            <button type="button" onclick="setDifficulty('hard')" id="btn-hard" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Hard</button>
        </div>

        <!-- Wordle Grid Container -->
        <div id="wordle-grid" class="card-section p-4 bg-zinc-900/90 w-full max-w-[340px] flex flex-col gap-2 items-center justify-center select-none">
            <!-- Dynamically populated rows -->
        </div>

        <!-- On-Screen Virtual Keyboard -->
        <div class="w-full max-w-[380px] space-y-1.5 pt-1">
            <div class="flex justify-center gap-1" id="kb-row-1">
                <!-- Q W E R T Y U I O P -->
            </div>
            <div class="flex justify-center gap-1" id="kb-row-2">
                <!-- A S D F G H J K L -->
            </div>
            <div class="flex justify-center gap-1" id="kb-row-3">
                <!-- ENTER Z X C V B N M BACK -->
            </div>
        </div>

        <!-- Action Controls -->
        <div class="flex gap-2 justify-center pt-2">
            <button type="button" onclick="resetGame()" class="btn-card playables-hover text-zinc-400 px-5 py-2 text-xs">New Word</button>
            <button type="button" onclick="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">
                <span>Fullscreen</span> ⛶
            </button>
        </div>

        <!-- RESULT POPUP MODAL -->
        <div id="result-modal" class="absolute inset-0 z-50 flex items-center justify-center modal-backdrop hidden rounded-xl">
            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Game Over</h2>
                <p id="modal-message" class="text-zinc-300 text-base">The match has concluded.</p>
                <div>
                    <button type="button" onclick="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-2 md:my-4 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'match') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        const wordPools = {
            easy: ["APPLE", "BEACH", "CHAIR", "DANCE", "EARTH", "FRUIT", "GRAPE", "HOUSE", "LIGHT", "MUSIC"],
            medium: ["PLANET", "STREAM", "CANVAS", "DIGITAL", "PYTHON", "VECTOR", "BROWSER", "WIDGET"],
            hard: ["ALGORITHM", "FRAMEWORK", "REPOSITORY", "STRUCTURE", "NAVIGATION"]
        };

        let difficulty = 'easy';
        let targetWord = "APPLE";
        let wordLength = 5;
        let guesses = [];
        let currentGuess = "";
        let isGameActive = true;
        let keyStates = {};

        const wordleGrid = document.getElementById('wordle-grid');
        const statusDisplay = document.getElementById('game-status');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });
            if (level === 'easy') wordLength = 5;
            else if (level === 'medium') wordLength = 6;
            else wordLength = 7;
            resetGame();
        }

        function resetGame() {
            playSound('click');
            isGameActive = true;
            guesses = [];
            currentGuess = "";
            keyStates = {};

            let pool = wordPools[difficulty];
            targetWord = pool[Math.floor(Math.random() * pool.length)];
            wordLength = targetWord.length;

            statusDisplay.textContent = `Guess the ${wordLength}-letter hidden word in 6 tries!`;
            renderGrid();
            renderKeyboard();
        }

        function renderGrid() {
            wordleGrid.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = "flex gap-1.5";
                let guessStr = guesses[i] || (i === guesses.length ? currentGuess : "");

                for (let j = 0; j < wordLength; j++) {
                    const tile = document.createElement('div');
                    tile.className = "wordle-tile";
                    let char = guessStr[j] || "";
                    tile.textContent = char;

                    if (i < guesses.length) {
                        let targetChars = targetWord.split('');
                        let guessChars = guesses[i].split('');
                        
                        if (guessChars[j] === targetChars[j]) {
                            tile.classList.add('correct');
                            keyStates[guessChars[j]] = 'correct';
                        } else if (targetChars.includes(guessChars[j])) {
                            tile.classList.add('present');
                            if (keyStates[guessChars[j]] !== 'correct') {
                                keyStates[guessChars[j]] = 'present';
                            }
                        } else {
                            tile.classList.add('absent');
                            if (!keyStates[guessChars[j]]) {
                                keyStates[guessChars[j]] = 'absent';
                            }
                        }
                    }
                    row.appendChild(tile);
                }
                wordleGrid.appendChild(row);
            }
            renderKeyboard();
        }

        function renderKeyboard() {
            const rows = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
                ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'BACK']
            ];

            rows.forEach((r, idx) => {
                const rowEl = document.getElementById(`kb-row-${idx + 1}`);
                rowEl.innerHTML = '';
                r.forEach(char => {
                    const btn = document.createElement('button');
                    btn.className = "keyboard-key";
                    btn.textContent = char;
                    if (char === 'ENTER' || char === 'BACK') {
                        btn.style.fontSize = "0.7rem";
                        btn.style.padding = "8px 6px";
                    }

                    if (keyStates[char] === 'correct') {
                        btn.style.backgroundColor = '#047857';
                        btn.style.borderColor = '#059669';
                    } else if (keyStates[char] === 'present') {
                        btn.style.backgroundColor = '#b45309';
                        btn.style.borderColor = '#d97706';
                    } else if (keyStates[char] === 'absent') {
                        btn.style.backgroundColor = '#27272a';
                        btn.style.borderColor = '#3f3f46';
                        btn.style.opacity = '0.5';
                    }

                    btn.onclick = () => handleKeyPress(char);
                    rowEl.appendChild(btn);
                });
            });
        }

        function handleKeyPress(char) {
            if (!isGameActive) return;
            playSound('click');

            if (char === 'BACK') {
                if (currentGuess.length > 0) {
                    currentGuess = currentGuess.slice(0, -1);
                }
            } else if (char === 'ENTER') {
                if (currentGuess.length !== wordLength) {
                    statusDisplay.textContent = `Word must be ${wordLength} letters long!`;
                    playSound('lose');
                    return;
                }
                guesses.push(currentGuess);
                let solved = currentGuess === targetWord;
                currentGuess = "";
                renderGrid();

                if (solved) {
                    endGame(true, "Fantastic! You guessed the word correctly!");
                    return;
                }
                if (guesses.length >= 6) {
                    endGame(false, `Game Over! The word was "${targetWord}".`);
                    return;
                }
            } else {
                if (currentGuess.length < wordLength) {
                    currentGuess += char;
                }
            }
            renderGrid();
        }

        document.addEventListener('keydown', (e) => {
            if (!isGameActive) return;
            let key = e.key.toUpperCase();
            if (key === 'BACKSPACE') {
                handleKeyPress('BACK');
            } else if (key === 'ENTER') {
                handleKeyPress('ENTER');
            } else if (/^[A-Z]$/.test(key)) {
                handleKeyPress(key);
            }
        });

        function endGame(isWin, message) {
            isGameActive = false;
            if (isWin) {
                playSound('win');
                modalTitle.textContent = "Victory!";
            } else {
                playSound('lose');
                modalTitle.textContent = "Defeat!";
            }
            modalMessage.textContent = message;
            resultModal.classList.remove('hidden');
            statusDisplay.textContent = "Game Finished";
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
</body>
</html>
