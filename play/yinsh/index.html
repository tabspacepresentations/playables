        tailwind.config = {

    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">
                    <img src="../../images/logo.png" alt="Tabspace Presentations Logo" class="h-16 md:h-20 w-auto object-contain block opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ YINSH</span>
            </div>
            <nav class="hidden md:flex items-center gap-3 text-base">

            </nav>
        </div>

    <!-- HEADER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-3 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>

    </div>

    <!-- MAIN GAME CONTAINER -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">YINSH Strategy Game</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Phase: Place Rings (White Rings left: <span id="white-rings-count">5</span>)</p>
        </div>

        <!-- Difficulty Controls Only -->
        <div class="flex items-center gap-2 bg-zinc-900/60 p-1.5 rounded-xl border border-zinc-800">
            <button onclick="setDifficulty('easy')" id="btn-easy" class="px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold">Easy AI</button>
            <button onclick="setDifficulty('medium')" id="btn-medium" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all bg-zinc-800">Medium AI</button>
            <button onclick="setDifficulty('hard')" id="btn-hard" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all bg-zinc-800">Hard AI</button>
        </div>

        <!-- Canvas Board Container -->
        <div class="card-section p-3 bg-zinc-900/90 w-full max-w-[380px] aspect-square flex items-center justify-center relative overflow-hidden">
            <canvas id="yinsh-canvas" class="w-full h-full cursor-pointer touch-none"></canvas>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center gap-3">
            <button onclick="resetGame()" class="cta-btn-green px-6 py-2.5 text-sm">New Game</button>
            <button onclick="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2 text-xs md:text-sm flex items-center gap-1.5">
                <span>Fullscreen</span> ⛶
            </button>
        </div>

        <!-- RESULT POPUP MODAL -->
        <div id="result-modal" class="absolute inset-0 z-50 flex items-center justify-center modal-backdrop hidden rounded-xl">
            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Match Concluded</h2>
                <p id="modal-message" class="text-zinc-300 text-base">Game finished.</p>
                <div>
                    <button onclick="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER AD BANNER SLOT -->
    <div class="w-full flex flex-col items-center justify-center my-3 px-4">
        <span class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Advertisement</span>
        <div class="w-full max-w-[728px] min-h-[60px] md:min-h-[90px] bg-zinc-900/80 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-500 text-xs md:text-sm overflow-hidden">
            <span>Horizontal Banner Ad (728 × 90)</span>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'place') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(550, now);
                osc.frequency.exponentialRampToValueAtTime(350, now + 0.08);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        // Simplified YINSH coordinate layout approximation for canvas intersections
        // Real YINSH uses a hexagonal layout; we map intersection points
        let points = [];
        let rings = []; // {x, y, player}
        let markers = []; // {x, y, player} ('white' or 'black')
        let phase = 'place_rings'; // 'place_rings', 'move_ring', 'remove_row'
        let turn = 'white'; // 'white' or 'black'
        let difficulty = 'easy';
        let selectedRingIdx = null;
        let whiteRingsLeft = 5;
        let blackRingsLeft = 5;
        let whiteRingsRemoved = 0;
        let blackRingsRemoved = 0;
        let isGameActive = true;

        const canvas = document.getElementById('yinsh-canvas');
        const ctx = canvas.getContext('2d');
        const statusDisplay = document.getElementById('game-status');
        const whiteRingsCountEl = document.getElementById('white-rings-count');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all bg-zinc-800";
                }
            });
            resetGame();
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                renderBoard();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        function resetGame() {
            playSound('click');
            isGameActive = true;
            phase = 'place_rings';
            turn = 'white';
            rings = [];
            markers = [];
            selectedRingIdx = null;
            whiteRingsLeft = 5;
            blackRingsLeft = 5;
            whiteRingsRemoved = 0;
            blackRingsRemoved = 0;

            generateIntersectionPoints();
            resizeCanvas();
            updateStatus();
        }

        function generateIntersectionPoints() {
            points = [];
            // Generate a symmetric grid of points for board intersections
            const cx = 160, cy = 160, spacing = 32;
            for (let r = -4; r <= 4; r++) {
                for (let c = -4; c <= 4; c++) {
                    if (Math.abs(r + c) <= 4 && Math.abs(r) <= 4 && Math.abs(c) <= 4) {
                        // Exclude some corners to form YINSH star/hex shape roughly
                        if (!(Math.abs(r) === 4 && Math.abs(c) === 4)) {
                            points.push({
                                x: cx + c * spacing + r * (spacing * 0.5),
                                y: cy + r * (spacing * 0.866),
                                r, c
                            });
                        }
                    }
                }
            }
        }

        function updateStatus() {
            whiteRingsCountEl.textContent = whiteRingsLeft;
            if (phase === 'place_rings') {
                statusDisplay.textContent = turn === 'white' ? `Phase: Place Rings (White left: ${whiteRingsLeft})` : `Computer is placing ring...`;
            } else if (phase === 'move_ring') {
                statusDisplay.textContent = turn === 'white' ? `Phase: Select & Move your Ring` : `Computer is moving ring...`;
            } else if (phase === 'remove_row') {
                statusDisplay.textContent = turn === 'white' ? `Row formed! Click 5 markers of your color to remove them + 1 Ring.` : `Computer is removing row...`;
            }
        }

        function renderBoard() {
            if (!canvas) return;
            const width = canvas.width > 0 ? canvas.width / window.devicePixelRatio : 320;
            const height = canvas.height > 0 ? canvas.height / window.devicePixelRatio : 320;
            ctx.clearRect(0, 0, width, height);

            // Draw grid lines connecting points
            ctx.strokeStyle = '#3f3f46';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < points.length; i++) {
                for (let j = i + 1; j < points.length; j++) {
                    let p1 = points[i];
                    let p2 = points[j];
                    let dist = Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);
                    if (dist < 38) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }

            // Draw intersection dots
            points.forEach((p, idx) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#71717a';
                ctx.fill();
            });

            // Draw markers (chips)
            markers.forEach(m => {
                ctx.beginPath();
                ctx.arc(m.x, m.y, 9, 0, Math.PI * 2);
                ctx.fillStyle = m.player === 'white' ? '#f4f4f5' : '#18181b';
                ctx.fill();
                ctx.strokeStyle = m.player === 'white' ? '#a1a1aa' : '#52525b';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // Draw rings
            rings.forEach((ring, idx) => {
                ctx.beginPath();
                ctx.arc(ring.x, ring.y, 13, 0, Math.PI * 2);
                ctx.strokeStyle = ring.player === 'white' ? '#22c55e' : '#ff6D00';
                ctx.lineWidth = 3;
                if (idx === selectedRingIdx) {
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 8;
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
        }

        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
            let clientY = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        if (canvas) {
            canvas.addEventListener('click', (e) => handleCanvasClick(getTouchPos(e)));
        }

        function handleCanvasClick(pos) {
            if (!isGameActive || turn !== 'white') return;

            // Find nearest intersection point
            let clickedPoint = null;
            let minDist = 20;
            points.forEach(p => {
                let dist = Math.sqrt((p.x - pos.x)**2 + (p.y - pos.y)**2);
                if (dist < minDist) {
                    minDist = dist;
                    clickedPoint = p;
                }
            });

            if (!clickedPoint) return;

            if (phase === 'place_rings') {
                // Check if point already has a ring
                let hasRing = rings.some(r => Math.abs(r.x - clickedPoint.x) < 5 && Math.abs(r.y - clickedPoint.y) < 5);
                if (!hasRing) {
                    rings.push({ x: clickedPoint.x, y: clickedPoint.y, player: 'white' });
                    whiteRingsLeft--;
                    playSound('place');
                    renderBoard();

                    if (whiteRingsLeft === 0 && blackRingsLeft === 0) {
                        phase = 'move_ring';
                    } else {
                        // AI place black ring
                        turn = 'black';
                        updateStatus();
                        setTimeout(aiTurn, 600);
                        return;
                    }
                    turn = 'white';
                    updateStatus();
                }
            } else if (phase === 'move_ring') {
                if (selectedRingIdx === null) {
                    // Select ring belonging to white
                    let ringIdx = rings.findIndex(r => r.player === 'white' && Math.abs(r.x - clickedPoint.x) < 15 && Math.abs(r.y - clickedPoint.y) < 15);
                    if (ringIdx !== -1) {
                        selectedRingIdx = ringIdx;
                        playSound('click');
                        renderBoard();
                    }
                } else {
                    // Move selected ring to clicked point and leave marker
                    let selRing = rings[selectedRingIdx];
                    let hasRing = rings.some(r => Math.abs(r.x - clickedPoint.x) < 5 && Math.abs(r.y - clickedPoint.y) < 5);
                    if (!hasRing) {
                        // Leave marker at old ring position
                        markers.push({ x: selRing.x, y: selRing.y, player: 'white' });
                        // Move ring to new position
                        selRing.x = clickedPoint.x;
                        selRing.y = clickedPoint.y;
                        playSound('place');
                        selectedRingIdx = null;
                        renderBoard();

                        // Check row completion (5 markers in a row)
                        if (checkRowCompletion('white')) {
                            phase = 'remove_row';
                            updateStatus();
                        } else {
                            turn = 'black';
                            updateStatus();
                            setTimeout(aiTurn, 700);
                        }
                    } else {
                        selectedRingIdx = null;
                        renderBoard();
                    }
                }
            } else if (phase === 'remove_row') {
                // Simplified row removal: click a marker to remove it
                let mIdx = markers.findIndex(m => Math.abs(m.x - clickedPoint.x) < 15 && Math.abs(m.y - clickedPoint.y) < 15);
                if (mIdx !== -1) {
                    markers.splice(mIdx, 1);
                    whiteRingsRemoved++;
                    playSound('place');
                    renderBoard();

                    if (whiteRingsRemoved >= 3 || rings.length <= 2) {
                        endGame('white');
                    } else {
                        phase = 'move_ring';
                        turn = 'black';
                        updateStatus();
                        setTimeout(aiTurn, 700);
                    }
                }
            }
        }

        function aiTurn() {
            if (!isGameActive) return;

            if (phase === 'place_rings') {
                let emptyPoints = points.filter(p => !rings.some(r => Math.abs(r.x - p.x) < 5 && Math.abs(r.y - p.y) < 5));
                if (emptyPoints.length > 0) {
                    let pt = emptyPoints[Math.floor(Math.random() * emptyPoints.length)];
                    rings.push({ x: pt.x, y: pt.y, player: 'black' });
                    blackRingsLeft--;
                    playSound('place');
                }
                if (whiteRingsLeft === 0 && blackRingsLeft === 0) {
                    phase = 'move_ring';
                }
                turn = 'white';
                updateStatus();
                renderBoard();
            } else if (phase === 'move_ring') {
                let blackRings = rings.map((r, idx) => ({ ...r, idx })).filter(r => r.player === 'black');
                if (blackRings.length > 0) {
                    let ring = blackRings[Math.floor(Math.random() * blackRings.length)];
                    let emptyPoints = points.filter(p => !rings.some(r => Math.abs(r.x - p.x) < 5 && Math.abs(r.y - p.y) < 5));
                    if (emptyPoints.length > 0) {
                        let pt = emptyPoints[Math.floor(Math.random() * emptyPoints.length)];
                        markers.push({ x: ring.x, y: ring.y, player: 'black' });
                        rings[ring.idx].x = pt.x;
                        rings[ring.idx].y = pt.y;
                        playSound('place');
                    }
                }
                turn = 'white';
                updateStatus();
                renderBoard();
            }
        }

        function checkRowCompletion(player) {
            // Simplified check for demonstration
            return markers.filter(m => m.player === player).length >= 5;
        }

        function endGame(winner) {
            isGameActive = false;
            if (winner === 'white') {
                playSound('win');
                modalTitle.textContent = "Victory!";
                modalMessage.textContent = "Brilliant YINSH strategy! You removed 3 rings and won the match!";
            } else {
                playSound('lose');
                modalTitle.textContent = "Defeat!";
                modalMessage.textContent = "Computer removed 3 rings first! Better luck next time.";
            }
            resultModal.classList.remove('hidden');
            statusDisplay.textContent = "Match Concluded";
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
