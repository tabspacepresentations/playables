    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        const BOARD_SIZE = 11; // 11x11 Tafl Board
        let board = [];
        let turn = 'defender'; // 'defender' (white/player) or 'attacker' (black/AI)
        let selectedPiece = null;
        let validMoves = [];
        let isGameActive = true;
        let difficulty = 'easy';
        let isAiTurn = false;

        const canvas = document.getElementById('tafl-canvas');
        const ctx = canvas.getContext('2d');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        let statusDisplay = document.getElementById('game-status');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });
            resetGame();
        }

        function resetGame() {
            playSound('click');
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            
            // Setup Attackers (Black) - 24 pieces
            const attackerPositions = [
                [0,3],[0,4],[0,5],[0,6],[0,7],
                [1,5],
                [3,0],[4,0],[5,0],[6,0],[7,0],
                [5,1],
                [10,3],[10,4],[10,5],[10,6],[10,7],
                [9,5],
                [3,10],[4,10],[5,10],[6,10],[7,10],
                [5,9]
            ];
            attackerPositions.forEach(([r, c]) => { board[r][c] = 'attacker'; });

            // Setup Defenders (White) - 12 pieces
            const defenderPositions = [
                [3,5],[4,4],[4,5],[4,6],[5,3],[5,4],[5,6],[5,7],[6,4],[6,5],[6,6],[7,5]
            ];
            defenderPositions.forEach(([r, c]) => { board[r][c] = 'defender'; });

            // Setup King (White King) at center (5,5)
            board[5][5] = 'king';

            turn = 'defender';
            selectedPiece = null;
            validMoves = [];
            isGameActive = true;
            isAiTurn = false;
            statusDisplay.textContent = "Your turn (Defenders / White)";
            resizeCanvas();
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            renderBoard();
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        function renderBoard() {
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, width, height);

            const cellSize = width / BOARD_SIZE;

            // Wood-like background
            ctx.fillStyle = '#c29b61';
            ctx.fillRect(0, 0, width, height);

            // Draw special squares: Throne (5,5) and Corners (0,0), (0,10), (10,0), (10,10)
            const corners = [[0,0], [0,10], [10,0], [10,10]];
            corners.forEach(([r, c]) => {
                ctx.fillStyle = '#78350f';
                ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
            });

            // Throne
            ctx.fillStyle = '#78350f';
            ctx.fillRect(5 * cellSize, 5 * cellSize, cellSize, cellSize);

            // Grid lines
            ctx.strokeStyle = '#5a3d1e';
            ctx.lineWidth = 1;
            for (let i = 0; i <= BOARD_SIZE; i++) {
                let pos = i * cellSize;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(width, pos);
                ctx.stroke();
            }

            // Highlight valid moves
            validMoves.forEach(m => {
                ctx.fillStyle = 'rgba(34, 197, 94, 0.4)';
                ctx.fillRect(m.c * cellSize, m.r * cellSize, cellSize, cellSize);
            });

            // Highlight selected piece
            if (selectedPiece) {
                ctx.strokeStyle = '#ff6D00';
                ctx.lineWidth = 3;
                ctx.strokeRect(selectedPiece.c * cellSize, selectedPiece.r * cellSize, cellSize, cellSize);
            }

            // Draw pieces
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let piece = board[r][c];
                    if (piece) {
                        let cx = (c + 0.5) * cellSize;
                        let cy = (r + 0.5) * cellSize;
                        let radius = cellSize * 0.38;

                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);

                        if (piece === 'attacker') {
                            ctx.fillStyle = '#18181b';
                            ctx.fill();
                            ctx.lineWidth = 2;
                            ctx.strokeStyle = '#3f3f46';
                            ctx.stroke();
                        } else if (piece === 'defender') {
                            ctx.fillStyle = '#f4f4f5';
                            ctx.fill();
                            ctx.lineWidth = 2;
                            ctx.strokeStyle = '#d4d4d8';
                            ctx.stroke();
                        } else if (piece === 'king') {
                            ctx.fillStyle = '#fbbf24';
                            ctx.fill();
                            ctx.lineWidth = 2;
                            ctx.strokeStyle = '#d97706';
                            ctx.stroke();
                            // Draw crown symbol on king
                            ctx.fillStyle = '#78350f';
                            ctx.font = `${cellSize * 0.4}px sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('👑', cx, cy);
                        }
                    }
                }
            }
        }

        canvas.addEventListener('click', (e) => {
            if (!isGameActive || isAiTurn || turn !== 'defender') return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cellSize = (canvas.width / window.devicePixelRatio) / BOARD_SIZE;

            let c = Math.floor(x / cellSize);
            let r = Math.floor(y / cellSize);

            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                let piece = board[r][c];

                // If clicking own piece, select it
                if (piece === 'defender' || piece === 'king') {
                    selectedPiece = { r, c };
                    validMoves = getValidMoves(r, c);
                    playSound('click');
                    renderBoard();
                } else if (selectedPiece) {
                    // Check if clicked spot is a valid move
                    let move = validMoves.find(m => m.r === r && m.c === c);
                    if (move) {
                        makeMove(selectedPiece.r, selectedPiece.c, r, c);
                    } else {
                        selectedPiece = null;
                        validMoves = [];
                        renderBoard();
                    }
                }
            }
        });

        function getValidMoves(r, c) {
            let moves = [];
            let dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];

            dirs.forEach(d => {
                let step = 1;
                while (true) {
                    let nr = r + d.r * step;
                    let nc = c + d.c * step;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;

                    // Obstacle check
                    if (board[nr][nc] !== null) break;

                    // Restrict corners and center throne for regular pieces
                    let isCorner = (nr === 0 && nc === 0) || (nr === 0 && nc === 10) || (nr === 10 && nc === 0) || (nr === 10 && nc === 10);
                    let isThrone = (nr === 5 && nc === 5);
                    if ((isCorner || isThrone) && board[r][c] !== 'king') {
                        // Only king can enter throne/corners, others can pass or not land depending on rules, standard tafl restricts landing on throne/corners except king.
                        step++;
                        continue;
                    }

                    moves.push({ r: nr, c: nc });
                    step++;
                }
            });
            return moves;
        }

        function makeMove(fromR, fromC, toR, toC) {
            let piece = board[fromR][fromC];
            board[fromR][fromC] = null;
            board[toR][toC] = piece;

            playSound('click');
            selectedPiece = null;
            validMoves = [];

            // Check win conditions
            if (piece === 'king' && (toR === 0 || toR === 10 || toC === 0 || toC === 10)) {
                endGame('defender');
                return;
            }

            // Capture mechanics (custody capture: sandwiching enemy between two friendly pieces or castle square)
            checkCaptures(toR, toC, piece);

            renderBoard();

            if (piece === 'king' && isKingCaptured()) {
                endGame('attacker');
                return;
            }

            if (turn === 'defender') {
                turn = 'attacker';
                isAiTurn = true;
                statusDisplay.textContent = "Computer is thinking...";
                setTimeout(aiMove, 600);
            } else {
                turn = 'defender';
                isAiTurn = false;
                statusDisplay.textContent = "Your turn (Defenders / White)";
            }
        }

        function checkCaptures(r, c, mover) {
            let enemyTypes = mover === 'attacker' ? ['defender', 'king'] : ['attacker'];
            let dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];

            dirs.forEach(d => {
                let adjR = r + d.r;
                let adjC = c + d.c;
                let farR = r + d.r * 2;
                let farC = c + d.c * 2;

                if (adjR >= 0 && adjR < BOARD_SIZE && adjC >= 0 && adjC < BOARD_SIZE) {
                    let neighbor = board[adjR][adjC];
                    if (neighbor && enemyTypes.includes(neighbor)) {
                        if (neighbor === 'king') {
                            // King capture requires 4 sides or 3 + throne depending on variant; here simplified to surrounded or trapped
                            if (isKingCaptured()) {
                                board[adjR][adjC] = null;
                            }
                        } else {
                            if (farR >= 0 && farR < BOARD_SIZE && farC >= 0 && farC < BOARD_SIZE) {
                                let farPiece = board[farR][farC];
                                let isFarCornerOrThrone = (farR === 5 && farC === 5) || ((farR === 0 || farR === 10) && (farC === 0 || farC === 10));
                                if ((farPiece && (farPiece === mover || farPiece === 'king')) || isFarCornerOrThrone) {
                                    board[adjR][adjC] = null;
                                }
                            }
                        }
                    }
                }
            });
        }

        function isKingCaptured() {
            // Find king
            let kr = -1, kc = -1;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === 'king') { kr = r; kc = c; }
                }
            }
            if (kr === -1) return true; // King is gone

            // If king is on throne, needs 4 attackers surrounding
            if (kr === 5 && kc === 5) {
                let attackersAround = 0;
                let dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                dirs.forEach(d => {
                    let ar = kr + d.r, ac = kc + d.c;
                    if (board[ar][ac] === 'attacker') attackersAround++;
                });
                return attackersAround === 4;
            }

            // Otherwise 2 opposite attackers
            let dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
            let trappedVertically = (
                (kr > 0 && board[kr-1][kc] === 'attacker' && kr < 10 && board[kr+1][kc] === 'attacker')
            );
            let trappedHorizontally = (
                (kc > 0 && board[kr][kc-1] === 'attacker' && kc < 10 && board[kr][kc+1] === 'attacker')
            );

            return trappedVertically || trappedHorizontally;
        }

        function aiMove() {
            if (!isGameActive) return;

            // Gather all attacker pieces and their valid moves
            let allMoves = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === 'attacker') {
                        selectedPiece = { r, c };
                        let moves = getValidMoves(r, c);
                        moves.forEach(m => allMoves.push({ fromR: r, fromC: c, toR: m.r, toC: m.c }));
                    }
                }
            }
            selectedPiece = null;

            if (allMoves.length > 0) {
                let chosenMove = allMoves[Math.floor(Math.random() * allMoves.length)];
                makeMove(chosenMove.fromR, chosenMove.fromC, chosenMove.toR, chosenMove.toC);
            } else {
                endGame('defender'); // No moves left for attackers
            }
        }

        function endGame(winner) {
            isGameActive = false;
            if (winner === 'defender') {
                playSound('win');
                modalTitle.textContent = "Defenders Win!";
                modalMessage.textContent = "The King successfully escaped to safety!";
            } else {
                playSound('lose');
                modalTitle.textContent = "Attackers Win!";
                modalMessage.textContent = "The King has been captured!";
            }
            resultModal.classList.remove('hidden');
            statusDisplay.textContent = "Game Over";
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
</body>
</html>
